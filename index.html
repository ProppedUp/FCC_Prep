<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FCC Prep Trainer</title>
<link rel="stylesheet" href="./css/style.css?v=20260528-8">
</head>
<body>

<h1>FCC Prep Trainer</h1>
<p id="questionStatus">Loading questions...</p>

<div class="card">
<label for="element">Element</label>
<select id="element" onchange="updateQuestionStatus()">
<option value="all">All Elements</option>
<option value="1">Element 1 - Marine Radio Operator Permit</option>
<option value="3">Element 3 - General Radiotelephone</option>
</select>

<label for="mode">Mode</label>
<select id="mode">
<option value="study">Study Mode - show answers and navigation</option>
<option value="test">Test Mode - results only at end</option>
</select>

<label for="count">Question Count</label>
<input id="count" type="number" value="35">

<button id="startBtn" onclick="startQuiz()" disabled>Start Quiz</button>
</div>

<div id="quiz" class="card" style="display:none;">
<div id="progress"></div>
<div id="liveScore" style="margin-top:8px;"></div>

<div id="studyTools" style="margin-top:16px;margin-bottom:16px;">
  <button id="markBtn" onclick="toggleMarkedQuestion()">Mark Question</button>
  <div id="markStatus" style="margin-top:10px;"></div>
  <label for="questionJump" style="display:block;margin-top:12px;">Jump to Question</label>
  <select id="questionJump" onchange="jumpToQuestion()"></select>
  <button id="prevBtn" onclick="previousQuestion()">Previous</button>
  <button id="nextMarkedBtn" onclick="nextMarkedQuestion()">Next Marked</button>
</div>

<h2 id="qid"></h2>
<div id="question"></div>
<div id="options"></div>
<button id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
</div>

<div id="results" class="card" style="display:none;"></div>

<script src="./js/questionLoader.js?v=20260528-8"></script>
<script>
let BANK = [];
let quiz = [];
let index = 0;
let correct = 0;
let requestedCount = 0;
let currentMode = 'study';
let markedQuestions = new Set();
let answeredQuestions = new Set();
let userAnswers = new Map();

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function getSelectedPool() {
  const element = document.getElementById('element').value;
  return BANK.filter(q => element === 'all' || q.element === element);
}

function getSelectedElementLabel() {
  const select = document.getElementById('element');
  return select.options[select.selectedIndex].text;
}

function updateQuestionStatus() {
  const status = document.getElementById('questionStatus');

  if (!BANK.length) {
    status.innerText = 'Loading questions...';
    return;
  }

  const selectedPool = getSelectedPool();
  status.innerText = `${getSelectedElementLabel()}: ${selectedPool.length} questions available (${BANK.length} total loaded)`;
}

async function initApp() {
  const status = document.getElementById('questionStatus');

  try {
    BANK = await loadQuestionPool();
    updateQuestionStatus();
    document.getElementById('startBtn').disabled = false;
  } catch (error) {
    console.error(error);
    status.innerText = 'Question data failed to load.';
  }
}

function buildQuizPool(pool, count) {
  if (!pool.length) return [];

  let output = [];
  while (output.length < count) output = output.concat(shuffle(pool));
  return output.slice(0, count);
}

function startQuiz() {
  if (!BANK.length) {
    alert('Question data is still loading. Please try again.');
    return;
  }

  requestedCount = parseInt(document.getElementById('count').value, 10) || 35;
  currentMode = document.getElementById('mode').value;

  const filtered = getSelectedPool();
  quiz = buildQuizPool(filtered, requestedCount);

  index = 0;
  correct = 0;
  markedQuestions = new Set();
  answeredQuestions = new Set();
  userAnswers = new Map();

  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';

  updateJumpMenu();
  renderQuestion();
}

function getQuestionKey(q) {
  return q.id || `${q.element}-${q.question}`;
}

function updateJumpMenu() {
  const jump = document.getElementById('questionJump');
  jump.innerHTML = '';

  quiz.forEach((q, i) => {
    const option = document.createElement('option');
    const mark = markedQuestions.has(getQuestionKey(q)) ? '★ ' : '';
    const answered = answeredQuestions.has(i) ? '✓ ' : '';
    option.value = i;
    option.text = `${mark}${answered}${i + 1}. ${q.id}`;
    jump.appendChild(option);
  });
}

function updateMarkedUi(q) {
  const key = getQuestionKey(q);
  const markedCount = markedQuestions.size;
  const isMarked = markedQuestions.has(key);

  document.getElementById('markBtn').innerText = isMarked ? 'Unmark Question' : 'Mark Question';
  document.getElementById('markStatus').innerText = isMarked
    ? `★ Marked for review (${markedCount} marked)`
    : `${markedCount} marked for review`;

  const studyNavigation = currentMode === 'study';
  document.getElementById('questionJump').style.display = studyNavigation ? 'block' : 'none';
  document.querySelector('label[for="questionJump"]').style.display = studyNavigation ? 'block' : 'none';
  document.getElementById('prevBtn').style.display = studyNavigation ? 'block' : 'none';
  document.getElementById('nextMarkedBtn').style.display = studyNavigation ? 'block' : 'none';

  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextMarkedBtn').disabled = markedCount === 0;
  document.getElementById('questionJump').value = index;
}

function updateLiveScore() {
  const liveScore = document.getElementById('liveScore');

  if (currentMode !== 'study') {
    liveScore.innerText = '';
    return;
  }

  const answered = answeredQuestions.size;
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  liveScore.innerText = answered
    ? `Study score: ${pct}% (${correct}/${answered}) - ${pct >= 74 ? 'PASSING' : 'NOT PASSING'}`
    : 'Study score: no answers yet';
}

function renderQuestion() {
  const q = quiz[index];

  document.getElementById('progress').innerText =
    `Question ${index + 1} / ${quiz.length} (${currentMode === 'study' ? 'Study' : 'Test'} Mode)`;

  document.getElementById('qid').innerText = q.id;
  document.getElementById('question').innerText = q.question;

  const options = document.getElementById('options');
  options.innerHTML = '';

  ['A', 'B', 'C', 'D'].forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerText = letter + '. ' + q.options[letter];

    if (answeredQuestions.has(index)) {
      btn.disabled = true;
      const selected = userAnswers.get(index);
      if (currentMode === 'study') {
        if (letter === q.answer) btn.classList.add('correct');
        if (letter === selected && selected !== q.answer) btn.classList.add('wrong');
      }
    }

    btn.onclick = () => answerQuestion(letter, btn, q);
    options.appendChild(btn);
  });

  document.getElementById('nextBtn').disabled = !answeredQuestions.has(index);
  updateMarkedUi(q);
  updateLiveScore();
}

function answerQuestion(letter, btn, q) {
  if (answeredQuestions.has(index)) return;

  answeredQuestions.add(index);
  userAnswers.set(index, letter);

  if (letter === q.answer) correct++;

  document.querySelectorAll('.option').forEach(x => x.disabled = true);

  if (currentMode === 'study') {
    if (letter === q.answer) {
      btn.classList.add('correct');
    } else {
      btn.classList.add('wrong');
      document.querySelectorAll('.option').forEach(x => {
        if (x.innerText.startsWith(q.answer + '.')) x.classList.add('correct');
      });
    }
  }

  updateJumpMenu();
  updateLiveScore();
  document.getElementById('nextBtn').disabled = false;
}

function toggleMarkedQuestion() {
  const q = quiz[index];
  const key = getQuestionKey(q);

  if (markedQuestions.has(key)) markedQuestions.delete(key);
  else markedQuestions.add(key);

  updateJumpMenu();
  updateMarkedUi(q);
}

function jumpToQuestion() {
  if (currentMode !== 'study') return;
  index = parseInt(document.getElementById('questionJump').value, 10);
  renderQuestion();
}

function previousQuestion() {
  if (currentMode !== 'study' || index <= 0) return;
  index--;
  renderQuestion();
}

function nextMarkedQuestion() {
  if (currentMode !== 'study' || !markedQuestions.size) return;

  for (let offset = 1; offset <= quiz.length; offset++) {
    const candidate = (index + offset) % quiz.length;
    if (markedQuestions.has(getQuestionKey(quiz[candidate]))) {
      index = candidate;
      renderQuestion();
      return;
    }
  }
}

function nextQuestion() {
  index++;

  if (index >= quiz.length) {
    finishQuiz();
    return;
  }

  renderQuestion();
}

function finishQuiz() {
  const pct = Math.round(correct / quiz.length * 100);

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';

  document.getElementById('results').innerHTML = `
    <h2>Results</h2>
    <p><b>Mode:</b> ${currentMode === 'study' ? 'Study' : 'Test'}</p>
    <p><b>Score:</b> ${pct}%</p>
    <p><b>Correct:</b> ${correct} / ${quiz.length}</p>
    <p><b>Marked:</b> ${markedQuestions.size}</p>
    <p><b>Status:</b> ${pct >= 74 ? 'PASSING' : 'NOT PASSING'}</p>
  `;
}

initApp();
</script>

</body>
</html>
