<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FCC Prep Trainer</title>
<link rel="stylesheet" href="./css/style.css?v=20260528-7">
</head>
<body>

<h1>FCC Prep Trainer</h1>
<p id="questionStatus">Loading questions...</p>

<div class="card">
<label for="element">Element</label>
<select id="element" onchange="updateQuestionStatus()">
<option value="all">All Elements</option>
<option value="1">Element 1 - Marine Radio Operator Permit</option>
<option value="3">Element 3 - General Radiotelephone</option>
</select>

<label for="count">Question Count</label>
<input id="count" type="number" value="35">

<button id="startBtn" onclick="startQuiz()" disabled>Start Quiz</button>
</div>

<div id="quiz" class="card" style="display:none;">
<div id="progress"></div>
<h2 id="qid"></h2>
<div id="question"></div>
<div id="options"></div>

<div id="studyTools" style="margin-top:16px;">
  <button id="markBtn" onclick="toggleMarkedQuestion()">Mark Question</button>
  <div id="markStatus" style="margin-top:10px;"></div>
  <label for="questionJump" style="display:block;margin-top:12px;">Jump to Question</label>
  <select id="questionJump" onchange="jumpToQuestion()"></select>
  <button id="prevBtn" onclick="previousQuestion()">Previous</button>
  <button id="nextMarkedBtn" onclick="nextMarkedQuestion()">Next Marked</button>
</div>

<button id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
</div>

<div id="results" class="card" style="display:none;"></div>

<script src="./js/questionLoader.js?v=20260528-7"></script>
<script>
let BANK = [];
let quiz = [];
let index = 0;
let correct = 0;
let requestedCount = 0;
let markedQuestions = new Set();
let answeredQuestions = new Set();

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function getSelectedPool() {
  const element = document.getElementById('element').value;
  return BANK.filter(q => element === 'all' || q.element === element);
}

function getSelectedElementLabel() {
  const select = document.getElementById('element');
  return select.options[select.selectedIndex].text;
}

function updateQuestionStatus() {
  const status = document.getElementById('questionStatus');

  if (!BANK.length) {
    status.innerText = 'Loading questions...';
    return;
  }

  const selectedPool = getSelectedPool();
  status.innerText = `${getSelectedElementLabel()}: ${selectedPool.length} questions available (${BANK.length} total loaded)`;
}

async function initApp() {
  const status = document.getElementById('questionStatus');

  try {
    BANK = await loadQuestionPool();
    updateQuestionStatus();
    document.getElementById('startBtn').disabled = false;
  } catch (error) {
    console.error(error);
    status.innerText = 'Question data failed to load.';
  }
}

function buildQuizPool(pool, count) {
  if (!pool.length) {
    return [];
  }

  let output = [];

  while (output.length < count) {
    output = output.concat(shuffle(pool));
  }

  return output.slice(0, count);
}

function startQuiz() {
  if (!BANK.length) {
    alert('Question data is still loading. Please try again.');
    return;
  }

  requestedCount = parseInt(document.getElementById('count').value, 10) || 35;

  const filtered = getSelectedPool();
  quiz = buildQuizPool(filtered, requestedCount);

  index = 0;
  correct = 0;
  markedQuestions = new Set();
  answeredQuestions = new Set();

  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';

  updateJumpMenu();
  renderQuestion();
}

function getQuestionKey(q) {
  return q.id || `${q.element}-${q.question}`;
}

function updateJumpMenu() {
  const jump = document.getElementById('questionJump');
  jump.innerHTML = '';

  quiz.forEach((q, i) => {
    const option = document.createElement('option');
    const mark = markedQuestions.has(getQuestionKey(q)) ? '★ ' : '';
    option.value = i;
    option.text = `${mark}${i + 1}. ${q.id}`;
    jump.appendChild(option);
  });
}

function updateMarkedUi(q) {
  const key = getQuestionKey(q);
  const markedCount = markedQuestions.size;
  const isMarked = markedQuestions.has(key);

  document.getElementById('markBtn').innerText = isMarked ? 'Unmark Question' : 'Mark Question';
  document.getElementById('markStatus').innerText = isMarked
    ? `★ Marked for review (${markedCount} marked)`
    : `${markedCount} marked for review`;

  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextMarkedBtn').disabled = markedCount === 0;
  document.getElementById('questionJump').value = index;
}

function renderQuestion() {
  const q = quiz[index];

  document.getElementById('progress').innerText =
    `Question ${index + 1} / ${quiz.length} (requested ${requestedCount})`;

  document.getElementById('qid').innerText = q.id;
  document.getElementById('question').innerText = q.question;

  const options = document.getElementById('options');
  options.innerHTML = '';

  ['A', 'B', 'C', 'D'].forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerText = letter + '. ' + q.options[letter];

    btn.onclick = () => {
      document.querySelectorAll('.option').forEach(x => x.disabled = true);
      answeredQuestions.add(index);

      if (letter === q.answer) {
        btn.classList.add('correct');
        correct++;
      } else {
        btn.classList.add('wrong');

        document.querySelectorAll('.option').forEach(x => {
          if (x.innerText.startsWith(q.answer + '.')) {
            x.classList.add('correct');
          }
        });
      }

      document.getElementById('nextBtn').disabled = false;
    };

    options.appendChild(btn);
  });

  document.getElementById('nextBtn').disabled = answeredQuestions.has(index) ? false : true;
  updateMarkedUi(q);
}

function toggleMarkedQuestion() {
  const q = quiz[index];
  const key = getQuestionKey(q);

  if (markedQuestions.has(key)) {
    markedQuestions.delete(key);
  } else {
    markedQuestions.add(key);
  }

  updateJumpMenu();
  updateMarkedUi(q);
}

function jumpToQuestion() {
  const jump = document.getElementById('questionJump');
  index = parseInt(jump.value, 10);
  renderQuestion();
}

function previousQuestion() {
  if (index <= 0) {
    return;
  }

  index--;
  renderQuestion();
}

function nextMarkedQuestion() {
  if (!markedQuestions.size) {
    return;
  }

  for (let offset = 1; offset <= quiz.length; offset++) {
    const candidate = (index + offset) % quiz.length;
    if (markedQuestions.has(getQuestionKey(quiz[candidate]))) {
      index = candidate;
      renderQuestion();
      return;
    }
  }
}

function nextQuestion() {
  index++;

  if (index >= quiz.length) {
    finishQuiz();
    return;
  }

  renderQuestion();
}

function finishQuiz() {
  const pct = Math.round(correct / quiz.length * 100);

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';

  document.getElementById('results').innerHTML = `
    <h2>Results</h2>
    <p><b>Score:</b> ${pct}%</p>
    <p><b>Correct:</b> ${correct} / ${quiz.length}</p>
    <p><b>Requested:</b> ${requestedCount}</p>
    <p><b>Marked:</b> ${markedQuestions.size}</p>
    <p><b>Status:</b> ${pct >= 74 ? 'PASSING' : 'NOT PASSING'}</p>
  `;
}

initApp();
</script>

</body>
</html>
