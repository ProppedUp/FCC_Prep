ly.", "D": "Monthly."}, "answer": "A"}, {"id": "1-17C4", "element": "1", "question": "The best way to test the MF-HF NBDP system is?", "options": {"A": "Make a radiotelephone call to a coast station.", "B": "Initiate an ARQ call to demonstrate that the transmitter and antenna are working.", "C": "Initiate an FEC call to demonstrate that the transmitter and antenna are working.", "D": "Initiate an ARQ call to a Coast Station and wait for the automatic exchange of answerbacks."}, "answer": "D"}, {"id": "1-17C5", "element": "1", "question": "The best way to test the Inmarsat-C terminal is?", "options": {"A": "Compose and send a brief message to your own Inmarsat-C terminal.", "B": "Send a message to a shore terminal and wait for confirmation.", "C": "Send a message to another ship terminal.", "D": "If the \u201cSend\u201d light flashes, proper operation has been confirmed."}, "answer": "A"}, {"id": "1-17C6", "element": "1", "question": "When may you test a radiotelephone transmitter on the air?", "options": {"A": "Between midnight and 6:00 AM local time.", "B": "Only when authorized by the Commission.", "C": "At any time (except during silent periods) as necessary to assure proper operation.", "D": "After reducing transmitter power to 1 watt."}, "answer": "C"}, {"id": "1-18C1", "element": "1", "question": "Under normal circumstances, what do you do if the transmitter aboard your ship is operating off- frequency, overmodulating or distorting?", "options": {"A": "Reduce to low power.", "B": "Reduce audio volume level.", "C": "Stop transmitting.", "D": "Make a notation in station operating log."}, "answer": "C"}, {"id": "1-18C2", "element": "1", "question": "Which would be an indication of proper operation of a SSB transmitter rated at 60 watt PEP output?", "options": {"A": "In SSB (J3E) voice mode, with the transmitter keyed but without speaking into the microphone, power output is indicated.", "B": "In SITOR communications, the power meter can be seen fluctuating regula ystem."}, "answer": "C"}, {"id": "1-20D3", "element": "1", "question": "Which of the following terms is defined as a back-up power source that provides power to radio installations for the purpose of conducting Distress and Safety communications when the vessel\u2019s main and emergency generators cannot?", "options": {"A": "Emergency Diesel Generator. C. Reserve Source of Diesel Power.", "B": "Reserve Source of Energy. D. Emergency Back-up Generator. 1-20D4 In the event of failure of the main and emergency sources of electrical power, what is the term for the source required to supply the GMDSS console with power for conducting distress and other radio communications? A. Emergency power.", "C": "Reserve source of energy. B. Ship\u2019s emergency diesel generator.", "D": "Ship\u2019s standby generator"}, "answer": "B"}, {"id": "1-20D5", "element": "1", "question": "What is the requirement for emergency and reserve power in GMDSS radio installations?", "options": {"A": "An emergency power source for radio communications is not required if a vessel has proper reserve power (batteries).", "B": "A reserve power source is not required for radio communications.", "C": "Only one of the above is required if a vessel is equipped with a second 406 EPIRB as a backup means of sending a distress alert.", "D": "All newly constructed ships under GMDSS must have both emergency and reserve power sources for radio communications."}, "answer": "D"}, {"id": "1-20D6", "element": "1", "question": "What is the meaning of \u201cReserve Source of Energy\u201d?", "options": {"A": "The supply of electrical energy sufficient to operate the radio installations for the purpose of conducting Distress and Safety communications in the event of failure of the ship\u2019s main and emergency sources of electrical power.", "B": "High caloric value items for lifeboat, per SOLAS regulations.", "C": "Diesel fuel stored for the purpose of operating the powered survival craft for a period equal to or exceeding the U.S.C.G. and SOLAS requirements.", "D": "None of these."}, "answer": "A"}, {"id": "1-21D1", "element": "1", "question": "What is an EPIRB?", "options": {"A": "A battery-operated emergency position-indicating radio beacon that floats free of a sinking ship.", "B": "An alerting device notifying mariners of imminent danger.", "C": "A satellite-based maritime distress and safety alerting system.", "D": "A high-efficiency audio amplifier."}, "answer": "A"}, {"id": "1-21D2", "element": "1", "question": "When are EPIRB batteries changed?", "options": {"A": "After emergency use; after battery life expires.", "B": "After emergency use or within the month and year replacement date printed on the EPIRB.", "C": "After emergency use; every 12 months when not used.", "D": "Whenever voltage drops to less than 20% of full charge."}, "answer": "B"}, {"id": "1-21D3", "element": "1", "question": "If a ship sinks, what device is designed to float free of the mother ship, is turned on automatically and transmits a distress signal?", "options": {"A": "An emergency position indicating radio beacon.", "B": "EPIRB on 2182 kHz and 405.025 kHz.", "C": "Bridge-to-bridge transmitter on 2182 kHz.", "D": "Auto alarm keyer on any frequency."}, "answer": "A"}, {"id": "1-21D4", "element": "1", "question": "How do you cancel a false EPIRB distress alert?", "options": {"A": "Transmit a DSC distress alert cancellation.", "B": "Transmit a broadcast message to \u201call stations\u201d canceling the distress message.", "C": "Notify the Coast Guard or rescue coordination center at once.", "D": "Make a radiotelephony \u201cdistress cancellation\u201d transmission on 2182 kHz."}, "answer": "C"}, {"id": "1-21D5", "element": "1", "question": "What is the COSPAS-SARSAT system?", "options": {"A": "A global satellite communications system for users in the maritime, land and aeronautical mobile services.", "B": "An international satellite-based search and rescue system.", "C": "A broadband military satellite communications network.", "D": "A Wide Area Geostationary Satellite program (WAGS)."}, "answer": "B"}, {"id": "1-21D6", "element": "1", "question": "What is an advantage of a 406 MHz satellite EPIRB?", "options": {"A": "It is compatible with the COSPAS-SARSAT Satellites and Global Maritime Distress Safety System (GMDSS) regulations.", "B": "Provides a fast, accurate method for the Coast Guard to locating and rescuing persons in distress.", "C": "Includes a digitally encoded message containing the ship\u2019s identity and nationality.", "D": "All of the above."}, "answer": "D"}, {"id": "1-22D1", "element": "1", "question": "In which frequency band does a search and rescue transponder operate?", "options": {"A": "3 GHz.", "B": "S-band.", "C": "406 MHz.", "D": "9 GHz."}, "answer": "D"}, {"id": "1-22D2", "element": "1", "question": "How should the signal from a Search And Rescue Radar Transponder appear on a RADAR display?", "options": {"A": "A series of dashes.", "B": "A series of spirals all originating from the range and bearing of the SART.", "C": "A series of 12 equally spaced dots.", "D": "A series of twenty dashes."}, "answer": "C"}, {"id": "1-22D3", "element": "1", "question": "What is the purpose of the SART\u2019s audible tone alarm?", "options": {"A": "It informs survivors that assistance may be nearby.", "B": "It informs survivors when the battery\u2019s charge condition has weakened.", "C": "It informs survivors when the SART switches to the \u201cstandby\u201d mode.", "D": "It informs survivors that a nearby vessel is signaling on DSC."}, "answer": "A"}, {"id": "1-22D4", "element": "1", "question": "Which statement is true regarding the SART?", "options": {"A": "This is a performance monitor attached to at least one S-band navigational RADAR system.", "B": "This is a 9 GHz transponder capable of being received by another vessel\u2019s S-band navigational RADAR system.", "C": "This is a performance monitor attached to at least one X-band navigational RADAR system.", "D": "This is a 9 GHz transponder capable of being received by vessel\u2019s X-band navigational RADAR system."}, "answer": "D"}, {"id": "1-22D5", "element": "1", "question": "At what point does a SART begin transmitting?", "options": {"A": "It immediately begins radiating when placed in the \u201con\u201d position.", "B": "It must be manually activated.", "C": "If it has been placed in the \u201con\u201d position, it will respond when it has been interrogated by a 9-GHz RADAR signal.", "D": "If it has been placed in the \u201con\u201d position, it will begin transmitting immediately upon detecting that it is in water."}, "answer": "C"}, {"id": "1-22D6", "element": "1", "question": "How can a SART\u2019s effective range be maximized?", "options": {"A": "The SART should be placed in water immediately upon activation.", "B": "The SART should be held as high as possible.", "C": "Switch the SART into the \u201chigh\u201d power position.", "D": "If possible, the SART should be mounted horizontally so that its signal matches that of the searching RADAR signal."}, "answer": "B"}, {"id": "1-23D1", "element": "1", "question": "Which statement is NOT true regarding the requirements of survival craft portable two-way VHF radiotelephone equipment?", "options": {"A": "Watertight to a depth of 1 meter for 5 minutes.", "B": "Effective radiated power should be a minimum of 0.25 watts.", "C": "Operates simplex on Ch-70 and at least one other channel.", "D": "The antenna is fixed and non-removable."}, "answer": "C"}, {"id": "1-23D2", "element": "1", "question": "Which statement is NOT true regarding the requirements of survival craft portable two-way VHF radiotelephone equipment?", "options": {"A": "Operation on Ch-13.", "B": "Effective radiated power should be a minimum of 0.25 Watts.", "C": "Simplex voice communications only.", "D": "Operation on Ch-16."}, "answer": "A"}, {"id": "1-23D3", "element": "1", "question": "With what other stations may portable survival craft transceivers communicate?", "options": {"A": "Communication is permitted between survival craft.", "B": "Communication is permitted between survival craft and ship.", "C": "Communication is permitted between survival craft and rescue unit.", "D": "All of the above."}, "answer": "D"}, {"id": "1-23D4", "element": "1", "question": "Equipment for radiotelephony use in survival craft stations under GMDSS must have what capability?", "options": {"A": "Operation on Ch-16.", "B": "Operation on 457.525 MHz.", "C": "Operation on 121.5 MHz.", "D": "Any one of these."}, "answer": "A"}, {"id": "1-23D5", "element": "1", "question": "Equipment for radiotelephony use in survival craft stations under GMDSS must have what characteristic(s)?", "options": {"A": "Operation on Ch-16.", "B": "Watertight.", "C": "Permanently-affixed antenna.", "D": "All of these."}, "answer": "D"}, {"id": "1-23D6", "element": "1", "question": "What is the minimum power of the SCT", "options": {"A": "Five watts.", "B": "One watt.", "C": "\u00bc watt.", "D": "None of the above."}, "answer": "B"}, {"id": "1-24D1", "element": "1", "question": "NAVTEX broadcasts are sent:", "options": {"A": "Immediately following traffic lists.", "B": "In categories of messages indicated by a single letter or identifier.", "C": "On request of maritime mobile stations.", "D": "Regularly, after the radiotelephone silent periods."}, "answer": "B"}, {"id": "1-24D2", "element": "1", "question": "MSI can be obtained by one (or more) of the following:", "options": {"A": "NAVTEX.", "B": "SafetyNET.", "C": "HF NBDP.", "D": "All of the above."}, "answer": "D"}, {"id": "1-24D3", "element": "1", "question": "Which of the following is the primary frequency that is used exclusively for NAVTEX broadcasts internationally?", "options": {"A": "518 kHz.", "B": "2187.5 kHz.", "C": "4209.5 kHz.", "D": "VHF channel 16 when the vessel is sailing in Sea Area A1, and 2187.5 kHz when in Sea Area A2."}, "answer": "A"}, {"id": "1-24D4", "element": "1", " 05, 35."}, "answer": "A"}, {"id": "1-3A5", "element": "1", "question": "Which is true concerning a required watch on VHF Ch-16?", "options": {"A": "It is compulsory at all times while at sea until further notice, unless the vessel is in a VTS system.", "B": "When a vessel is in an A1 sea area and subject to the Bridge-to-Bridge act and in a VTS system, a watch is not required on Ch-16, provided the vessel monitors both Ch-13 and VTS channel.", "C": "It is always compulsory in sea areas A2, A3 and A4.", "D": "All of the above."}, "answer": "D"}, {"id": "1-3A6", "element": "1", "question": "What are the mandatory DSC watchkeeping bands/channels?", "options": {"A": "VHF Ch-70, 2 MHz MF DSC, 6 MHz DSC and 1 other HF DSC.", "B": "8 MHz HF DSC, 1 other HF DSC, 2 MHz MF DSC and VHF Ch-70.", "C": "2 MHz MF DSC, 8 MHz DSC, VHF Ch-16 and 1 other HF DSC.", "D": "None of the above."}, "answer": "B"}, {"id": "1-4A2", "element": "1", "question": "Who is responsible for the proper maintenance of station logs?", "options": {"A": "The station licensee.", "B": "The commercially-licensed radio operator in charge of the station.", "C": "The ship\u2019s master and the station licensee.", "D": "The station licensee and the radio operator in charge of the station."}, "answer": "D"}, {"id": "1-4A3", "element": "1", "question": "Where must ship station logs be kept during a voyage?", "options": {"A": "At the principal radiotelephone operating position.", "B": "They must be secured in the vessel\u2019s strongbox for safekeeping.", "C": "In the personal custody of the licensed commercial radio operator.", "D": "All logs are turned over to the ship\u2019s master when the radio operator goes off duty."}, "answer": "A"}, {"id": "1-4A4", "element": "1", "question": "What is the proper procedure for making a correction in the station log?", "options": {"A": "The ship\u2019s master must be notified, approve and initial all changes to the station log.", "B": "The mistake may be erased and the correc here should the GMDSS radio log be kept on board ship?", "options": {"A": "Captain\u2019s office.", "B": "Sea cabin.", "C": "At the GMDSS operating position.", "D": "Anywhere on board the vessel."}, "answer": "C"}, {"id": "1-5A4", "element": "1", "question": "Which of the following statements is true?", "options": {"A": "Key letters or abbreviations may be used in GMDSS Radio Logbooks if their meaning is noted in the log.", "B": "Key letters or abbreviations may not be used in GMDSS Radio Logbooks under any circumstances.", "C": "All Urgency communications must be entered in the logbook.", "D": "None of the above."}, "answer": "A"}, {"id": "1-5A5", "element": "1", "question": "Which of the following logkeeping statements is true?", "options": {"A": "Entries relating to pre-voyage, pre-departure and daily tests are required.", "B": "Both a) and c)", "C": "A summary of all required Distress communications heard and Urgency communications affecting the station\u2019s own ship. Also, all Safety communications (other than VHF) affecting the station\u2019s own ship must be logged.", "D": "Routine daily MF-HF and Inmarsat-C transmissions do not have to be logged."}, "answer": "B"}, {"id": "1-5A6", "element": "1", "question": "Which of the following statements concerning log entries is false?", "options": {"A": "All Safety communications received on VHF must be logged.", "B": "All required equipment tests must be logged.", "C": "The radio operator must log on and off watch.", "D": "The vessels daily position must be entered in the log."}, "answer": "A"}, {"id": "1-6A1", "element": "1", "question": "What regulations govern the use and operation of FCC-licensed ship stations in international waters?", "options": {"A": "The regulations of the International Maritime Organization (IMO) and Radio Officers Union.", "B": "Part 80 of the FCC Rules plus the international Radio Regulations and agreements to which the United States is a party.", "C": "The Maritime Mobile Directives of n diode?", "options": {"A": "Maximum forward current and capacitance.", "B": "Maximum reverse current and PIV (peak inverse voltage).", "C": "Maximum reverse current and capacitance.", "D": "Maximum forward current and PIV (peak inverse voltage)."}, "answer": "D"}, {"id": "3-5A2", "element": "3", "question": "What limits the maximum forward current in a junction diode?", "options": {"A": "The peak inverse voltage (PIV).", "B": "The junction temperature.", "C": "The forward voltage.", "D": "The back EMF."}, "answer": "B"}, {"id": "3-5A3", "element": "3", "question": "MOSFETs are manufactured with THIS protective device built into their gate to protect the device from static charges and excessive voltages:", "options": {"A": "Schottky diode.", "B": "Metal oxide varistor (MOV).", "C": "Zener diode.", "D": "Tunnel diode."}, "answer": "C"}, {"id": "3-5A4", "element": "3", "question": "What are the two basic types of junction field-effect transistors?", "options": {"A": "N-channel and P-channel.", "B": "High power and low power.", "C": "MOSFET and GaAsFET.", "D": "Silicon FET and germanium FET."}, "answer": "A"}, {"id": "3-5A5", "element": "3", "question": "A common emitter amplifier has:", "options": {"A": "Lower input impedance than a common base.", "B": "More voltage gain than a common collector.", "C": "Less current gain than a common base.", "D": "Less voltage gain than a common collector."}, "answer": "B"}, {"id": "3-5A6", "element": "3", "question": "How does the input impedance of a field-effect transistor compare with that of a bipolar transistor?", "options": {"A": "An FET has high input impedance; a bipolar transistor has low input impedance.", "B": "One cannot compare input impedance without first knowing the supply voltage.", "C": "An FET has low input impedance; a bipolar transistor has high input impedance.", "D": "The input impedance of FETs and bipolar transistors is the same."}, "answer": "A"}, {"id": "3-60I1", "element": "3", "question": "When a lead-acid storage battery is being charged, a harmful effect to humans is:", "options": {"A": "Internal plate sulfation may occur under constant charging.", "B": "Emission of oxygen.", "C": "Emission of chlorine gas.", "D": "Emission of hydrogen gas."}, "answer": "D"}, {"id": "3-60I2", "element": "3", "question": "A battery with a terminal voltage of 12.5 volts is to be trickle-charged at a 0.5 A rate. What resistance should be connected in series with the battery to charge it from a 110-V DC line?", "options": {"A": "95 ohms.", "B": "300 ohms.", "C": "195 ohms.", "D": "None of these."}, "answer": "C"}, {"id": "3-60I3", "element": "3", "question": "What capacity in amperes does a storage battery need to be in order to operate a 50 watt transmitter for 6 hours? Assume a continuous transmitter load of 70% of the key-locked demand of 40 A, and an emergency light load of 1.5", "options": {"A": "A. 100 ampere-hours.", "B": "177 ampere-hours.", "C": "249 ampere-hours.", "D": "None of these."}, "answer": "B"}, {"id": "3-60I4", "element": "3", "question": "What is the total voltage when 12 Nickel-Cadmium batteries are connected in series?", "options": {"A": "12 volts.", "B": "12.6 volts.", "C": "15 volts.", "D": "72 volts."}, "answer": "C"}, {"id": "3-60I5", "element": "3", "question": "The average fully-charged voltage of a lead-acid storage cell is:", "options": {"A": "1 volt.", "B": "1.2 volts.", "C": "1.56 volts.", "D": "2.06 volts."}, "answer": "D"}, {"id": "3-60I6", "element": "3", "question": "A nickel-cadmium cell has an operating voltage of about:", "options": {"A": "1.25 volts.", "B": "1.4 volts.", "C": "1.5 volts.", "D": "2.1 volts."}, "answer": "A"}, {"id": "3-61I1", "element": "3", "question": "When an emergency transmitter uses 325 watts and a receiver uses 50 watts, how many hours can a 12.6 volt, 55 ampere-hour battery supply full power to both units?", "options": {"A": "1.8 hours.", "B": "6 hours.", "C": "3 hours.", "D": "1.2 hours."}, "answer": "A"}, {"id": "3-61I2", "element": "3", "question": "What current will flow in a 6 volt storage battery with an internal resistance of 0.01 ohms, when a 3-watt, 6-volt lamp is connected?", "options": {"A": "0.4885 amps.", "B": "0.4995 amps.", "C": "0.5566 amps.", "D": "0.5795 amps."}, "answer": "B"}, {"id": "3-61I3", "element": "3", "question": "A ship RADAR unit uses 315 watts and a radio uses 50 watts. If the equipment is connected to a 50 ampere-hour battery rated at 12.6 volts, how long will the battery last?", "options": {"A": "1 hour 43 minutes.", "B": "28.97 hours.", "C": "29 minutes.", "D": "10 hours, 50 minutes."}, "answer": "A"}, {"id": "3-61I4", "element": "3", "question": "If a marine radiotelephone receiver uses 75 watts of power and a transmitter uses 325 watts, how long can they both operate before discharging a 50 ampere-hour 12 volt battery?", "options": {"A": "40 minutes.", "B": "1 hour.", "C": "1 1/2 hours.", "D": "6 hours."}, "answer": "C"}, {"id": "3-61I5", "element": "3", "question": "A 6 volt battery with 1.2 ohms internal resistance is connected across two light bulbs in parallel whose resistance is 12 ohms each. What is the current flow?", "options": {"A": "0.57 amps.", "B": "0.83 amps.", "C": "1.0 amps.", "D": "6.0 amps."}, "answer": "B"}, {"id": "3-61I6", "element": "3", "question": "A 12.6 volt, 8 ampere-hour battery is supplying power to a receiver that uses 50 watts and a RADAR system that uses 300 watts. How long will the battery last?", "options": {"A": "100.8 hours.", "B": "27.7 hours.", "C": "1 hour.", "D": "17 minutes or 0.3 hours."}, "answer": "D"}, {"id": "3-62I1", "element": "3", "question": "What occurs if the load is removed from an operating series DC motor?", "options": {"A": "It will stop running.", "B": "Speed will increase slightly.", "C": "No change occurs.", "D": "It will accelerate until it falls apart."}, "answer": "D"}, {"id": "3-62I2", "element": "3", "question": "If a shunt motor running with a load has its shunt field opened, how would this affect the speed of the motor?", "options": {"A": "It will slow down.", "B": "It will stop suddenly.", "C": "It will speed up.", "D": "It will be unaffected."}, "answer": "C"}, {"id": "3-62I3", "element": "3", "question": "The expression \u0093voltage regulation\u0094 as it applies to a shunt-wound DC generator operating at a constant frequency refers to:", "options": {"A": "Voltage fluctuations from load to no-load.", "B": "Voltage output efficiency.", "C": "Voltage in the secondary compared to the primary.", "D": "Rotor winding voltage ratio"}, "answer": "A"}, {"id": "3-62I4", "element": "3", "question": "What is the line current of a 7 horsepower motor operating on 120 volts at full load, a power factor of 0.8, and 95% efficient?", "options": {"A": "4.72 amps.", "B": "13.03 amps.", "C": "56 amps.", "D": "57.2 amps."}, "answer": "D"}, {"id": "3-62I5", "element": "3", "question": "A 3 horsepower, 100 V DC motor is 85% efficient when developing its rated output. What is the current?", "options": {"A": "8.545 amps.", "B": "20.345 amps.", "C": "26.300 amps.", "D": "25.000 amps."}, "answer": "C"}, {"id": "3-62I6", "element": "3", "question": "The output of a separately-excited AC generator running at a constant speed can be controlled by:", "options": {"A": "The armature.", "B": "The amount of field current.", "C": "The brushes.", "D": "The exciter."}, "answer": "B"}, {"id": "3-63J1", "element": "3", "question": "Which of the following could cause a high standing wave ratio on a transmission line?", "options": {"A": "Excessive modulation.", "B": "An increase in output power.", "C": "A detuned antenna coupler.", "D": "Low power from the transmitter."}, "answer": "C"}, {"id": "3-63J2", "element": "3", "question": "Why is the value of the radiation resistance of an antenna important?", "options": {"A": "Knowing the radiation resistance makes it possible to match impedances for maximum power transfer.", "B": "Knowing the radiation resistance makes it possible to measure the near-field radiation density from transmitting antenna.", "C": "The value of the radiation resistance represents the front-to-side ratio of the antenna.", "D": "The value of the radiation resistance represents the front-to-back ratio of the antenna."}, "answer": "A"}, {"id": "3-63J3", "element": "3", "question": "A radio frequency device that allows RF energy to pass through in one direction with very little loss but absorbs RF power in the opposite direction is a:", "options": {"A": "Circulator.", "B": "Wave trap.", "C": "Multiplexer.", "D": "Isolator."}, "answer": "D"}, {"id": "3-63J4", "element": "3", "question": "What is an advantage of using a trap antenna?", "options": {"A": "It may be used for multiband operation.", "B": "It has high directivity in the high-frequency bands.", "C": "It has high gain.", "D": "It minimizes harmonic radiation."}, "answer": "A"}, {"id": "3-63J5", "element": "3", "question": "What is meant by the term radiation resistance of an antenna?", "options": {"A": "Losses in the antenna elements and feed line.", "B": "The specific impedance of the antenna.", "C": "The resistance in the trap coils to received signals.", "D": "An equivalent resistance that would dissipate the same amount of power as that radiated from an antenna."}, "answer": "D"}, {"id": "3-63J6", "element": "3", "question": "What is meant by the term antenna bandwidth?", "options": {"A": "Antenna length divided by the number of elements.", "B": "The frequency range over which an antenna can be expected to perform well.", "C": "The angle between the half-power radiation points.", "D": "The angle formed between two imaginary lines drawn through the ends of the elements."}, "answer": "B"}, {"id": "3-64J1", "element": "3", "question": "What is the current flowing through a 52 ohm line with an input of 1,872 watts?", "options": {"A": "0.06 amps.", "B": "6 amps.", "C": "28.7 amps.", "D": "144 amps."}, "answer": "B"}, {"id": "3-64J2", "element": "3", "question": "The voltage produced in a receiving antenna is:", "options": {"A": "Out of phase with the current if connected properly.", "B": "Out of phase with the current if cut to 1/3 wavelength.", "C": "Variable depending on the station\u0092s SWR.", "D": "Always proportional to the received field strength."}, "answer": "D"}, {"id": "3-64J3", "element": "3", "question": "Which of the following represents the best standing wave ratio (SWR)?", "options": {"A": "1:1.", "B": "1:1.5.", "C": "1:3.", "D": "1:4."}, "answer": "A"}, {"id": "3-64J4", "element": "3", "question": "At the ends of a half-wave antenna, what values of current and voltage exist compared to the remainder of the antenna?", "options": {"A": "Equal voltage and current.", "B": "Minimum voltage and maximum current.", "C": "Maximum voltage and minimum current.", "D": "Minimum voltage and minimum current."}, "answer": "C"}, {"id": "3-64J5", "element": "3", "question": "An antenna radiates a primary signal of 500 watts output. If there is a 2nd harmonic output of 0.5 watt, what attenuation of the 2nd harmonic has occurred?", "options": {"A": "10 dB.", "B": "30 dB.", "C": "40 dB.", "D": "50 dB."}, "answer": "B"}, {"id": "3-64J6", "element": "3", "question": "There is an improper impedance match between a 30 watt transmitter and the antenna, with 5 watts reflected. How much power is actually radiated?", "options": {"A": "35 watts.", "B": "30 watts.", "C": "25 watts.", "D": "20 watts."}, "answer": "C"}, {"id": "3-65J1", "element": "3", "question": "A vertical 1/4 wave antenna receives signals:", "options": {"A": "In the microwave band.", "B": "In one vertical direction.", "C": "In one horizontal direction.", "D": "Equally from all horizontal directions."}, "answer": "D"}, {"id": "3-65J2", "element": "3", "question": "The resonant frequency of a Hertz antenna can be lowered by:", "options": {"A": "Lowering the frequency of the transmitter.", "B": "Placing an inductance in series with the antenna.", "C": "Placing a condenser in series with the antenna.", "D": "Placing a resistor in series with the antenna."}, "answer": "B"}, {"id": "3-65J3", "element": "3", "question": "An excited 1/2 wavelength antenna produces:", "options": {"A": "Residual fields.", "B": "An electro-magnetic field only.", "C": "Both electro-magnetic and electro-static fields.", "D": "An electro-flux field sometimes."}, "answer": "C"}, {"id": "3-65J4", "element": "3", "question": "To increase the resonant frequency of a 1/4 wavelength antenna:", "options": {"A": "Add a capacitor in series.", "B": "Lower capacitor value.", "C": "Cut antenna.", "D": "Add an inductor."}, "answer": "A"}, {"id": "3-65J5", "element": "3", "question": "What happens to the bandwidth of an antenna as it is shortened through the use of loading coils?", "options": {"A": "It is increased.", "B": "It is decreased.", "C": "No change occurs.", "D": "It becomes flat."}, "answer": "B"}, {"id": "3-65J6", "element": "3", "question": "To lengthen an antenna electrically, add a:", "options": {"A": "Coil.", "B": "Resistor.", "C": "Battery.", "D": "Conduit."}, "answer": "A"}, {"id": "3-66J1", "element": "3", "question": "What is the meaning of the term velocity factor of a transmission line?", "options": {"A": "The ratio of the characteristic impedance of the line to the terminating impedance.", "B": "The velocity of the wave on the transmission line divided by the velocity of light in a vacuum.", "C": "The velocity of the wave on the transmission line multiplied by the velocity of light in a vacuum.", "D": "The index of shielding for coaxial cable."}, "answer": "B"}, {"id": "3-66J2", "element": "3", "question": "What determines the velocity factor in a transmission line?", "options": {"A": "The termination impedance.", "B": "The line length.", "C": "Dielectrics in the line.", "D": "The center conductor resistivity."}, "answer": "C"}, {"id": "3-66J3", "element": "3", "question": "Nitrogen is placed in transmission lines to:", "options": {"A": "Improve the \u0093skin-effect\u0094 of microwaves.", "B": "Reduce arcing in the line.", "C": "Reduce the standing wave ratio of the line.", "D": "Prevent moisture from entering the line."}, "answer": "D"}, {"id": "3-66J4", "element": "3", "question": "A perfect (no loss) coaxial cable has 7 dB of reflected power when the input is 5 watts. What is the output of the transmission line?", "options": {"A": "1 watt.", "B": "1.25 watts.", "C": "2.5 watts.", "D": "5 watts."}, "answer": "A"}, {"id": "3-66J5", "element": "3", "question": "Referred to the fundamental frequency, a shorted stub line attached to the transmission line to absorb even harmonics could have a wavelength of:", "options": {"A": "1.41 wavelength.", "B": "1/2 wavelength.", "C": "1/4 wavelength.", "D": "1/6 wavelength."}, "answer": "C"}, {"id": "3-66J6", "element": "3", "question": "If a transmission line has a power loss of 6 dB per 100 feet, what is the power at the feed point to the antenna at the end of a 200 foot transmission line fed by a 100 watt transmitter?", "options": {"A": "70 watts.", "B": "50 watts.", "C": "25 watts.", "D": "6 watts."}, "answer": "D"}, {"id": "3-67J1", "element": "3", "question": "What is the effective radiated power of a repeater with 50 watts transmitter power output, 4 dB feedline loss, 3 dB duplexer and circulator loss, and 6 dB antenna gain?", "options": {"A": "158 watts.", "B": "39.7 watts.", "C": "251 watts.", "D": "69.9 watts."}, "answer": "B"}, {"id": "3-67J2", "element": "3", "question": "What is the effective radiated power of a repeater with 75 watts transmitter power output, 4 dB feedline loss, 3 dB duplexer and circulator loss, and 10 dB antenna gain?", "options": {"A": "600 watts.", "B": "75 watts.", "C": "18.75 watts.", "D": "150 watts."}, "answer": "D"}, {"id": "3-67J3", "element": "3", "question": "What is the effective radiated power of a repeater with 75 watts transmitter power output, 5 dB feedline loss, 4 dB duplexer and circulator loss, and 6 dB antenna gain?", "options" let quiz = [];
let index = 0;
let correct = 0;

function shuffle(arr) {
 return arr.sort(()=>Math.random()-0.5);
}

function startQuiz() {
 const element = document.getElementById('element').value;
 const count = parseInt(document.getElementById('count').value);

 quiz = BANK.filter(q => element === 'all' || q.element === element);
 quiz = shuffle(quiz).slice(0,count);

 index = 0;
 correct = 0;

 document.getElementById('results').style.display='none';
 document.getElementById('quiz').style.display='block';

 renderQuestion();
}

function renderQuestion() {
 const q = quiz[index];

 document.getElementById('progress').innerText =
 `Question ${index+1} / ${quiz.length}`;

 document.getElementById('qid').innerText = q.id;
 document.getElementById('question').innerText = q.question;

 const options = document.getElementById('options');
 options.innerHTML='';

 ['A','B','C','D'].forEach(letter => {
   const btn = document.createElement('button');
   btn.className='option';
   btn.innerText = letter + '. ' + q.options[letter];

   btn.onclick = () => {
      document.querySelectorAll('.option').forEach(x=>x.disabled=true);

      if(letter === q.answer) {
        btn.classList.add('correct');
        correct++;
      } else {
        btn.classList.add('wrong');

        document.querySelectorAll('.option').forEach(x=>{
          if(x.innerText.startsWith(q.answer + '.'))
            x.classList.add('correct');
        });
      }

      document.getElementById('nextBtn').disabled=false;
   };

   options.appendChild(btn);
 });

 document.getElementById('nextBtn').disabled=true;
}

function nextQuestion() {
 index++;

 if(index >= quiz.length) {
   finishQuiz();
   return;
 }

 renderQuestion();
}

function finishQuiz() {
 const pct = Math.round(correct/quiz.length*100);

 document.getElementById('quiz').style.display='none';
 document.getElementById('results').style.display='block';

 document.getElementById('results').innerHTML = `
   <h2>Results</h2>
   <p><b>Score:</b> ${pct}%</p>
   <p><b>Correct:</b> ${correct} / ${quiz.length}</p>
   <p><b>Status:</b> ${pct >= 74 ? 'PASSING' : 'NOT PASSING'}</p>
 `;
}
</script>
