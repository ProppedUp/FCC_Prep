<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCCPrep Legacy Bank Export</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5;background:#111827;color:#f9fafb}
.card{background:#1f2937;border:1px solid #374151;border-radius:14px;padding:20px;margin:18px 0}
button{background:#2563eb;color:white;border:0;border-radius:10px;padding:14px 18px;font-weight:bold;cursor:pointer;margin:6px 6px 6px 0}
pre{white-space:pre-wrap;background:#0f172a;border-radius:10px;padding:12px;color:#d1d5db}
</style>
</head>
<body>
<h1>FCCPrep Legacy Bank Export</h1>
<div class="card">
<p>This temporary tool extracts the old embedded Element 1 and Element 3 bank into clean local JSON files.</p>
<button id="exportBtn">Export Element 1 and Element 3 JSON</button>
<pre id="status">Ready.</pre>
</div>
<script>
const LEGACY_BANK_URL='https://raw.githubusercontent.com/ProppedUp/FCC_Prep/5232bf76cf73f36421eca6d9573653269cce5896/index.html';
function downloadJson(filename,data){
  const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function cleanBank(bank){
  const byId=new Map();
  bank.forEach(q=>{
    if(!q||!q.id||!q.question||!q.options||!q.answer)return;
    if(/placeholder/i.test(q.question))return;
    byId.set(q.id,{...q,element:String(q.element)});
  });
  return [...byId.values()].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
}
async function exportBank(){
  const status=document.getElementById('status');
  status.textContent='Fetching old embedded bank...';
  const response=await fetch(LEGACY_BANK_URL,{cache:'no-store'});
  if(!response.ok)throw new Error('Legacy bank fetch failed: '+response.status);
  const html=await response.text();
  const match=html.match(/(?:const|var)\s+BANK\s*=\s*(\[[\s\S]*?\]);\s*(?:let|var|const)\s+quiz/);
  if(!match)throw new Error('Could not locate BANK array.');
  const bank=cleanBank(JSON.parse(match[1]));
  const element1=bank.filter(q=>q.element==='1');
  const element3=bank.filter(q=>q.element==='3');
  status.textContent=`Loaded ${bank.length} questions.\nElement 1: ${element1.length}\nElement 3: ${element3.length}\nDownloading files...`;
  downloadJson('element1.json',element1);
  downloadJson('element3.json',element3);
  status.textContent+=`\nDone. Upload these two files into /data, replacing the current element1.json and element3.json.`;
}
document.getElementById('exportBtn').addEventListener('click',()=>exportBank().catch(error=>{
  document.getElementById('status').textContent='Error: '+error.message;
  console.error(error);
}));
</script>
</body>
</html>
